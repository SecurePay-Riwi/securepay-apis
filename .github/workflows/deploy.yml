name: Deploy

# On every merge to main: build this repository's image, push it to ECR
# (securepay-dev-apis) tagged with the short commit and roll it out to the
# exchange-rates Lambda. Same flow as SecurePay's deploy.yml. Credentials
# come from GitHub's OIDC token (role securepay-dev-deploy-apis, which only
# trusts the main branch of this repository and may only push this image
# and update this Lambda); there are no AWS keys in GitHub.
#
# The dev environment is destroyed between work sessions, and the OIDC role
# goes with it. When the role cannot be assumed or the Lambda does not
# exist, the job ends green with a notice instead of failing.
#
# It can also be started by hand on main (Actions > Deploy > Run workflow),
# for example after `terraform apply`, to push the image of what is merged.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deploy at a time; a newer merge waits instead of cancelling a rollout.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  NAME_PREFIX: securepay-dev
  REPOSITORY: securepay-dev-apis
  LAMBDAS: exchange-rates

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # AWS_DEPLOY_ROLE_ARN is a repository variable (not a secret):
      # arn:aws:iam::<account>:role/securepay-dev-deploy-apis
      - name: Get AWS credentials
        id: aws
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Dev environment is off
        if: steps.aws.outcome != 'success'
        run: |
          echo "::notice title=Nothing deployed::The deploy role could not be assumed (dev is destroyed or AWS_DEPLOY_ROLE_ARN is not set)."

      - name: Log in to ECR
        id: ecr
        if: steps.aws.outcome == 'success'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set the image name
        id: image
        if: steps.aws.outcome == 'success'
        run: |
          tag="${GITHUB_SHA::7}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "uri=${{ steps.ecr.outputs.registry }}/${REPOSITORY}:${tag}" >> "$GITHUB_OUTPUT"

      # Tags are immutable in ECR: a rerun of the same commit reuses its image.
      - name: Build and push the image
        if: steps.aws.outcome == 'success'
        env:
          TAG: ${{ steps.image.outputs.tag }}
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          found=$(aws ecr batch-get-image --repository-name "${REPOSITORY}" \
            --image-ids imageTag="${TAG}" --query 'length(images)' --output text)
          if [ "${found}" != "0" ]; then
            echo "Image ${TAG} is already in ECR."
            exit 0
          fi
          # --provenance=false: Lambda rejects image indexes.
          docker build --provenance=false -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "::notice title=Image pushed::${IMAGE} (apis_image_tag = \"${TAG}\" in terraform.tfvars)"

      - name: Deploy the Lambdas
        if: steps.aws.outcome == 'success'
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          for name in ${LAMBDAS}; do
            function="${NAME_PREFIX}-${name}"
            if ! output=$(aws lambda update-function-code --function-name "${function}" \
                --image-uri "${IMAGE}" 2>&1 > /dev/null); then
              if grep -q ResourceNotFoundException <<< "${output}"; then
                echo "::notice title=Lambda not deployed::${function} does not exist (set apis_image_tag and apply)."
                continue
              fi
              echo "${output}"
              exit 1
            fi
            aws lambda wait function-updated --function-name "${function}"
            echo "${function} running ${IMAGE}"
          done
